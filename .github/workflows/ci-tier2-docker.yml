# Tier 2 CI: SECOFS_UFS Docker container (prep image) build + verify.
#
# Builds the prep-capable container (docker/Dockerfile.secofs_ufs --target
# runtime): EPIC spack-stack base + the develop nos_workflow/nos-utils Python
# pipeline + wgrib2/prod_util shims. This is the part that changes on every
# push; the model executable (fv3_coastalS.exe) is added locally for the
# Apptainer/Hercules image and is intentionally NOT built here.
#
# Triggers:
#   * every push / PR touching the container or workflow inputs
#   * nightly (07:00 UTC) so the image is rebuilt against upstream base updates
#   * manual (workflow_dispatch)
#
# Push to Docker Hub happens only on non-PR events (PRs build + verify only).
# Requires repo secrets: DOCKER_USERNAME, DOCKER_PASSWORD.

name: CI - Tier 2 (Docker Build & Verify)

on:
  push:
    branches: [main, develop, "feature/*"]
    paths:
      - 'docker/**'
      - 'jobs/**'
      - 'scripts/**'
      - 'ush/**'
      - 'parm/**'
      - 'versions/**'
      - 'fix/secofs_ufs/**'
      - '.github/workflows/ci-tier2-docker.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'docker/**'
      - 'jobs/**'
      - 'scripts/**'
      - 'ush/**'
      - 'parm/**'
      - '.github/workflows/ci-tier2-docker.yml'
  schedule:
    - cron: '0 7 * * *'   # nightly 07:00 UTC
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/secofs-ufs
  LOCAL_TAG: secofs-ufs:ci

jobs:
  build-verify-push:
    name: Build prep image, verify, push (non-PR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive   # ush/python/nos-utils is required by COPY ush/

      # The EPIC base (~10.7 GB) + image needs room beyond the default free disk.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the prep image (--target runtime) and load it locally so the
      # verify steps run against it on every event (incl. PRs, which don't push).
      - name: Build prep image (target=runtime)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.secofs_ufs
          target: runtime
          load: true
          push: false
          tags: ${{ env.LOCAL_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------- Verification (develop architecture) ----------------
      - name: Python packages import (nos_workflow + nos_utils)
        run: |
          docker run --rm --entrypoint bash ${{ env.LOCAL_TAG }} -lc '
            python3 -c "import nos_workflow; from nos_utils.nco_bridge import run_prep; print(\"OK: nos_workflow + nos_utils\")"
            python3 -c "import numpy, scipy, pandas, xarray, netCDF4, yaml, cfgrib; print(\"OK: forcing deps\")"
          '

      - name: Validate YAML configs
        run: |
          docker run --rm --entrypoint bash ${{ env.LOCAL_TAG }} -lc '
            FAIL=0
            for y in /opt/nosofs/parm/systems/*.yaml /opt/nosofs/parm/base/*.yaml; do
              python3 -c "import yaml,sys; c=yaml.safe_load(open(\"$y\")); assert isinstance(c,dict)" \
                && echo "  OK: $(basename $y)" || { echo "  FAIL: $(basename $y)"; FAIL=1; }
            done
            [ $FAIL -eq 0 ] || exit 1
          '

      - name: Check WCOSS2 path mirroring (develop layout)
        run: |
          docker run --rm --entrypoint bash ${{ env.LOCAL_TAG }} -lc '
            [ -L /lfs/h1/nos/nosofs/packages/nos-workflow ] && echo "OK: nos-workflow symlink" || { echo "FAIL: symlink"; exit 1; }
            [ -f /lfs/h1/nos/nosofs/packages/nos-workflow/parm/systems/secofs_ufs.yaml ] && echo "OK: secofs_ufs.yaml via WCOSS2 path" || { echo "FAIL"; exit 1; }
          '

      - name: Check tools (wgrib2, ndate, mpiexec, mpirun, python3)
        run: |
          docker run --rm --entrypoint bash ${{ env.LOCAL_TAG }} -lc '
            for t in wgrib2 ndate mpiexec mpirun python3; do
              command -v $t >/dev/null && echo "OK: $t ($(command -v $t))" || { echo "FAIL: $t"; exit 1; }
            done
          '

      - name: Check ndate arithmetic
        run: |
          docker run --rm --entrypoint bash ${{ env.LOCAL_TAG }} -lc '
            R=$(ndate 6 2026032418);  [ "$R" = 2026032500 ] && echo "OK: ndate +6h ($R)"  || { echo "FAIL +6h: $R"; exit 1; }
            R=$(ndate -24 2026032418); [ "$R" = 2026032318 ] && echo "OK: ndate -24h ($R)" || { echo "FAIL -24h: $R"; exit 1; }
          '

      - name: Dry run prep (Python CLI dispatch)
        run: |
          docker run --rm ${{ env.LOCAL_TAG }} prep --dry-run --pdy 20260324 --cyc 18 --ofs secofs_ufs 2>&1 | tee /tmp/dry.log
          grep -q "JNOS_PREP" /tmp/dry.log || { echo "FAIL: JNOS_PREP not in dry run"; exit 1; }
          grep -q "DRY RUN"   /tmp/dry.log || { echo "FAIL: dry-run marker missing"; exit 1; }
          echo "OK: prep dry run dispatches to JNOS_PREP"

      # ---------------- Push to Docker Hub (non-PR only) ----------------
      - name: Login to Docker Hub
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag and push prep image
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          SHORT=$(git rev-parse --short HEAD)
          TAGS="prep-latest prep-${SHORT}"
          [ "${{ github.event_name }}" = "schedule" ] && TAGS="$TAGS prep-nightly"
          for t in $TAGS; do
            docker tag ${{ env.LOCAL_TAG }} ${{ env.IMAGE_NAME }}:$t
            docker push ${{ env.IMAGE_NAME }}:$t
            echo "pushed ${{ env.IMAGE_NAME }}:$t"
          done

      - name: Summary
        run: |
          echo "=============================================="
          echo " Tier 2 CI (prep image): all checks passed"
          echo "   target=runtime  image=${{ env.IMAGE_NAME }}"
          echo "   event=${{ github.event_name }}"
          echo "   pushed=${{ github.event_name != 'pull_request' }}"
          echo "=============================================="
