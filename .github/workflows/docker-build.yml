name: Docker Build (stofsworkflow)

on:
  workflow_dispatch:
  push:
    branches: [develop, "feat/container-*"]
    paths:
      - 'containers/**'
      - 'sorc/**'
      - 'jobs/**'
      - 'scripts/**'
      - 'ush/**'
      - 'parm/**'
      - 'versions/**'
      - 'fix/**'
      - 'modulefiles/**'
      - '.github/workflows/docker-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # ush/python/nos-utils is COPY'd into the image

      # SLURM, ecFlow, ADCIRC, SCHISM and the NCEP libs build in the image; free the runner disk first. MJ (10/20/26)
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/develop'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and load
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./containers/Dockerfile
          load: true
          push: false
          tags: stofsworkflow:ci
          platforms: linux/amd64
          provenance: false

      - name: Smoke test
        run: |
          docker run --rm --entrypoint bash stofsworkflow:ci -c '
            export PYTHONPATH=/opt/nosofs/ush/python:/opt/nosofs/ush/python/nos-utils
            python3 -c "import nos_workflow, nos_utils, scipy; from nos_utils.nco_bridge import run_prep" &&
            test -x /opt/nosofs/exec/stofs_3d_atl_tide_fac && wgrib2 -version | head -1 && ncks --version 2>&1 | head -1'

      - name: Push (develop only)
        if: github.ref == 'refs/heads/develop'
        run: |
          docker tag stofsworkflow:ci ${{ secrets.DOCKER_USERNAME }}/stofsworkflow:develop
          docker push ${{ secrets.DOCKER_USERNAME }}/stofsworkflow:develop
