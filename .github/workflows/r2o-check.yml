name: NCO Compliance

on:
  push:
    branches: [main, develop, "feature/*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install r2o-check
      - name: r2o-check lint (advisory)
        run: r2o-check lint .
        continue-on-error: true
      - name: r2o-check lint JSON report (advisory)
        run: r2o-check lint . --format json -o r2o-results.json
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r2o-check-results
          path: r2o-results.json
