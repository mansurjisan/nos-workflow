name: NCO Compliance

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install r2o-check
      - run: r2o-check lint .
      - run: r2o-check lint . --format json -o r2o-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r2o-check-results
          path: r2o-results.json
