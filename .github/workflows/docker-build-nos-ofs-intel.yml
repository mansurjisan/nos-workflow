name: Docker Build NOS-OFS Intel

on:
  push:
    branches: [ main ]
    paths:
      - 'containers/Dockerfile.nos-ofs-intel'
      - 'sorc/nos_ofs/**'
      - '.github/workflows/docker-build-nos-ofs-intel.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'containers/Dockerfile.nos-ofs-intel'
      - 'sorc/nos_ofs/**'
      - '.github/workflows/docker-build-nos-ofs-intel.yml'
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # Intel compiler install takes time

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # Free up disk space for large build
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: mjisan/nos-ofs-intel
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./containers/Dockerfile.nos-ofs-intel
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test container
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm mjisan/nos-ofs-intel:${{ github.sha }} ls -la /opt/nosofs/exec/
          echo "Expected 22 executables:"
          docker run --rm mjisan/nos-ofs-intel:${{ github.sha }} ls /opt/nosofs/exec/ | wc -l
