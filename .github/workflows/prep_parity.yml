# ============================================================================
# prep_parity.yml — Prep-stage artifact parity gate (commit 4 of #219)
#
# Runs on every PR that touches the prep stage. Two-tier matrix:
#
#   tier-1 (hosted): cheap structural gate. Validates the golden
#     manifest JSON, runs the diff-machinery unit tests, and confirms
#     the new code imports cleanly. Always runs; no Docker.
#
#   tier-2 (self-hosted): full Docker parity test. Runs the prep stage
#     twice (Python path + NOS_USE_LEGACY_SHELL=YES legacy path) inside
#     the SECOFS-UFS container and diffs the resulting COMOUT trees.
#     Only runs on a self-hosted runner labeled `secofs-docker` (the
#     dev box that has the 12 GB image + staging dir at
#     /mnt/d/secofs_docker_data/).
#
# Trigger paths are scoped to the artifacts that can change prep
# behavior — the migrated stage module, the YAML→env bridge, the shim
# itself, the system YAML, and this workflow. The nos-utils submodule
# pointer move counts too because nco_bridge.run_prep lives there.
#
# Refs:
#   #219 — Migration punch list (commit-4 deliverables)
#   #220 — Philosophy: side-by-side diffs are first-class artifacts
# ============================================================================
name: prep-parity

on:
  push:
    branches:
      - main
      - "nos-unified-workflow"
      - "feature/*"
    paths:
      - "ush/python/nos_workflow/stages/prep.py"
      - "ush/python/nos_workflow/utils/yaml_to_env.py"
      - "ush/python/nos-utils/**"
      - "scripts/exnos_prep.sh"
      - "scripts/legacy/exnos_prep.sh.preY-mig"
      - "parm/systems/secofs_ufs.yaml"
      - "tests/integration/**"
      - ".github/workflows/prep_parity.yml"
  pull_request:
    branches:
      - main
      - "nos-unified-workflow"
    paths:
      - "ush/python/nos_workflow/stages/prep.py"
      - "ush/python/nos_workflow/utils/yaml_to_env.py"
      - "ush/python/nos-utils/**"
      - "scripts/exnos_prep.sh"
      - "scripts/legacy/exnos_prep.sh.preY-mig"
      - "parm/systems/secofs_ufs.yaml"
      - "tests/integration/**"
      - ".github/workflows/prep_parity.yml"
  workflow_dispatch:

jobs:
  # --------------------------------------------------------------------------
  # Tier 1: structural / manifest validation (cheap, always runs)
  # --------------------------------------------------------------------------
  manifest-and-helpers:
    name: Manifest schema + diff helpers (hosted)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # Minimal deps: pytest + netCDF4 for the in-process diff
          # helpers. Do NOT pip-install nos_workflow / nos-utils —
          # the WCOSS2 convention is git-pull only (see project
          # memory: feedback_git_workflow.md).
          pip install pytest pytest-cov netCDF4 numpy pyyaml

      - name: Validate golden manifest schema
        run: |
          set -eu
          # Skip the docker-dependent tests; we only want the manifest
          # schema check and the diff-helper unit tests here.
          export PYTHONPATH=ush/python:ush/python/nos-utils
          unset RUN_DOCKER_PARITY
          unset REGENERATE
          python -m pytest tests/integration/test_prep_artifact_parity.py \
            -v --tb=short \
            -k "well_formed or diff or classify or manifest_assertion"

      - name: Verify nos_workflow baseline tests still pass
        run: |
          set -eu
          export PYTHONPATH=ush/python:ush/python/nos-utils
          cd ush/python/nos_workflow
          python -m pytest -q

  # --------------------------------------------------------------------------
  # Tier 2: full Docker parity (opt-in, self-hosted, 15+ min)
  # --------------------------------------------------------------------------
  docker-parity:
    name: Docker prep parity (self-hosted)
    runs-on: [self-hosted, secofs-docker]
    if: ${{ env.SKIP_DOCKER_INTEGRATION != '1' }}
    timeout-minutes: 45
    needs: manifest-and-helpers
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Confirm Docker image + staging are present
        run: |
          set -eu
          docker image inspect nosofs/secofs-ufs:latest > /dev/null
          test -d /mnt/d/secofs_docker_data/com/nwm
          test -d /mnt/d/secofs_docker_data/fix/secofs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov netCDF4 numpy pyyaml

      - name: Run Docker prep parity
        env:
          # Bind-mount points expected by the test fixtures.
          SECOFS_STAGING_DIR: /mnt/d/secofs_docker_data
          SECOFS_DOCKER_IMAGE: nosofs/secofs-ufs:latest
          RUN_DOCKER_PARITY: "1"
        run: |
          set -eu
          export PYTHONPATH=ush/python:ush/python/nos-utils
          python -m pytest tests/integration/test_prep_artifact_parity.py \
            -v --tb=short \
            -k "python_vs_legacy"

      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prep-parity-diff-${{ github.run_id }}
          path: |
            /tmp/pytest-of-*/pytest-*/prep_parity*/**
            tests/integration/golden_manifests/*.json
          retention-days: 14
