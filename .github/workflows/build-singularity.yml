name: Build Singularity Container

on:
  push:
    branches: [main, develop]
    paths:
      - 'containers/nos-workflow.def'
      - '.github/workflows/build-singularity.yml'
  pull_request:
    branches: [main]
    paths:
      - 'containers/nos-workflow.def'
  workflow_dispatch:  # Allow manual trigger
  schedule:
    - cron: '0 2 * * 0'  # Weekly build on Sunday at 2 AM UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 3 hour timeout for large builds

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "=== Initial disk space ==="
          df -h

          # Remove unnecessary tools to free space
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          echo "=== Disk space after cleanup ==="
          df -h

      - name: Install Apptainer
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer
          apptainer --version

      - name: Build Singularity container
        run: |
          echo "=== Starting build ==="
          sudo apptainer build --notest nos-workflow.sif containers/nos-workflow.def

          echo "=== Build complete ==="
          ls -lh nos-workflow.sif

      - name: Test container
        run: |
          echo "=== Testing container ==="

          # Test ADCIRC
          apptainer exec nos-workflow.sif ls /opt/models/adcirc/bin/

          # Test SCHISM
          apptainer exec nos-workflow.sif ls /opt/models/schism/bin/ | head -5

          # Test ecFlow
          apptainer exec nos-workflow.sif /opt/ecflow/bin/ecflow_client --version

          # Test wgrib2
          apptainer exec nos-workflow.sif /opt/wgrib2/bin/wgrib2 -version | head -1

          # Test Python
          apptainer exec nos-workflow.sif python3 -c "import numpy; import netCDF4; print(f'numpy {numpy.__version__}, netCDF4 {netCDF4.__version__}')"

          # Test STOFS workflow CLI
          apptainer exec nos-workflow.sif stofs --help

          echo "=== All tests passed ==="

      - name: Upload artifact (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: nos-workflow-pr-${{ github.event.pull_request.number }}
          path: nos-workflow.sif
          retention-days: 7

      - name: Get version info
        id: version
        run: |
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +'%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.date }}-${{ steps.version.outputs.sha_short }}-${{ steps.version.outputs.timestamp }}
          name: NOS Workflow Container ${{ steps.version.outputs.date }}
          body: |
            ## NOS Workflow Singularity Container

            **Build Date:** ${{ steps.version.outputs.date }}
            **Commit:** ${{ github.sha }}

            ### Included Software
            - ADCIRC v56.0.3
            - SCHISM v5.11.0
            - ecFlow v5.6.0
            - SLURM v24.11.1.1
            - wgrib2
            - NCEP libraries

            ### Usage
            ```bash
            # Download (use latest release)
            wget https://github.com/${{ github.repository }}/releases/latest/download/nos-workflow.sif

            # Run interactive shell
            apptainer shell nos-workflow.sif

            # Run workflow
            apptainer exec nos-workflow.sif stofs prep-forecast --config config_schism.yaml
            ```
          files: nos-workflow.sif
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Sylabs Cloud
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.SYLABS_TOKEN }}" | apptainer remote login --tokenfile /dev/stdin SylabsCloud

      - name: Push to Sylabs Cloud
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          apptainer push nos-workflow.sif library://mansurjisan/nos-workflow/nos-workflow:latest
          apptainer push nos-workflow.sif library://mansurjisan/nos-workflow/nos-workflow:${{ steps.version.outputs.date }}

      - name: Summary
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          echo "Container built and released successfully!"
          echo "GitHub Release: https://github.com/${{ github.repository }}/releases/latest"
          echo "Sylabs Cloud: https://cloud.sylabs.io/library/mansurjisan/nos-workflow/nos-workflow"
