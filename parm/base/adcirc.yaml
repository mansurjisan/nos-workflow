# Base configuration for all ADCIRC-based OFS systems
# Systems inherit from this via _base: adcirc
#
# ADCIRC systems: STOFS-2D-GLO

model:
  type: adcirc
  version: "55.02"

  # Shell script variable mapping
  # OCEAN_MODEL = "ADCIRC"
  ocean_model: ADCIRC

  # Default physics parameters
  physics:
    dt: 2.0                   # Timestep (seconds) -> DELT_MODEL
    im: 111112                # Implicit mode (barotropic + GWCE)
    ics: 2                    # Coordinate system (2=spherical)
    nws: 12                   # OWI meteorological forcing

  # Default run configuration
  run:
    nowcast_hours: 6
    forecast_hours: 180       # 7.5-day forecast
    nback: 20                 # Hours to search back for hotstart

# Default forcing sources for ADCIRC
forcing:
  atmospheric:
    primary: gfs              # Global Forecast System
    resolution: 0.25
    wind_interval_ncst: 3600  # 1-hourly for nowcast
    wind_interval_fcst1: 3600   # 1-hourly for forecast 0-120h
    wind_interval_fcst2: 10800  # 3-hourly for forecast 120-180h

  tidal:
    enabled: true
    constituents:
      - M2
      - S2
      - N2
      - K2
      - K1
      - O1
      - P1
      - Q1

  river:
    enabled: false            # 2D barotropic, no river forcing

  ocean:
    enabled: false            # Global domain, no open boundary conditions

# Default output configuration
output:
  format: netcdf
  stations:
    enabled: true
    interval: 360.0           # Station output every 6 minutes
  fields_2d:
    enabled: true
    variables:
      - elevation             # Sea surface height
      - u-vel                 # Depth-averaged u velocity
      - v-vel                 # Depth-averaged v velocity
      - pressure              # Atmospheric pressure
  fields_3d:
    enabled: false            # 2D barotropic model
  products:
    - cwl                     # Combined water level
    - htp                     # Harmonic tide prediction
    - swl                     # Sub-tidal water level (cwl - htp)

# Default computational resources
resources:
  nprocs: 960                 # Override per system
  num_writers: 6              # ADCIRC writer processes
  ppn: 120                    # Processors per node
  memory_gb: 600
  walltime_hours: 4
