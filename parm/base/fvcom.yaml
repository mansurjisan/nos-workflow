# Base configuration for all FVCOM-based OFS systems

model:
  type: fvcom
  version: "4.1"

  physics:
    dt: 0.5
    dti: 10.0
    isplit: 20
    horzmix: closure
    vertmix: gotm
    bottom_roughness: 0.001

  vertical:
    ksl: 1
    kb: 21
    p_sigma: 1.0

  run:
    hindcast_days: 0.0        # No hindcast for lakes (cold start)
    forecast_days: 5.0

forcing:
  atmospheric:
    primary: hrrr
    fallback: gfs
    blend_enabled: true
    variables:
      - uwind
      - vwind
      - air_temperature
      - relative_humidity
      - air_pressure
      - precipitation
      - shortwave
      - longwave

  ocean:
    enabled: false            # Most FVCOM systems are lakes (no open ocean BC)

  river:
    enabled: true
    primary: nwm

  tidal:
    enabled: false
    # NGOFS2 overrides this - Gulf of Mexico has tides

output:
  format: netcdf
  stations:
    enabled: true
    interval: 360.0
  fields_2d:
    enabled: true
    variables:
      - zeta
      - ubar
      - vbar
  fields_3d:
    enabled: true
    variables:
      - temp
      - salinity
      - u
      - v
  intervals:
    hotstart_days: 1.0
    history_hours: 1.0

resources:
  nprocs: 240
  memory_gb: 400
  walltime_hours: 2
