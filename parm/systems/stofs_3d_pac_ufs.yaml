# STOFS-3D-PAC Configuration, copied from Atlantic

_base: schism

system:
  name: stofs_3d_pac
  description: "Storm Surge and Tide Operational Forecast System - 3D Pacific (UFS-Coastal)"
  framework: stofs_ufs
  prefix: stofs_3d_pac_ufs

execution:
  mode: ufs   # ufs (default, UFS-Coastal DATM) | standalone (classic SCHISM sflux)

# Applied only when execution.mode == standalone: 4912 compute ranks
# Grid/forcing blocks below are shared. MJ (10/02/26)
standalone:
  nws: 2
  executable: stofs_3d_pac_pschism_v3.1.5
  nscribes: 8
  nprocs: 3960

# Extra steps if needed
prep:
  extras:
    # glofas?

grid:
  n_nodes: 2961412
  n_elements: 5774631 
  n_levels: 84
  files:
    horizontal: stofs_3d_pac_ufs.hgrid.gr3
    vertical: stofs_3d_pac_ufs.vgrid.in
    horizontal_ll: stofs_3d_pac_ufs.hgrid.ll
    station: stofs_3d_pac_ufs.station.in
  domain: # taken from hgrid bbox
    lon_min: 93.11
    lon_max: 289.675
    lat_min: -33.039
    lat_max: 66.325

# Standalone: sflux prep. Coupled: the same GFS/HRRR processors feed the DATM blend. MJ (10/03/26)
forcing:
  atmospheric:
    met_num: 2
    gfs:
      resolution: "0.25"
      ops_timeline: true  # Use ops GFS setup logic
    # Ops keeps HRRR winds grid-relative (about 17 deg off over the Atlantic); no rotation in
    # extraction or in the DATM blender reproduces it. Parity only: SECOFS keeps its rotation. MJ (10/03/26)
#    hrrr:
#      rotate_winds: false
#      blend_rotate_winds: false
#      blend_weight: 0.99  # ops sflux inside HRRR coverage: 0.99*HRRR + 0.01*GFS (default sflux weights 99 / 1). MJ (10/03/26)
#      small_grib: true
#    hrrr_blend:
#      enabled: true
#      lon_min: -98.5
#      lon_max: -49.5
#      lat_min: 5.5
#      lat_max: 50.0
#
#  river:
#    primary: GLOFAS?
#    version: "v3.0"
#    n_list_target: 121
#    n_list_min: 97
#    # Ops v3.1.5 river inputs (1.99M sinks, source_sink.in / msource.th / vsink.th from the FIX
#    # files) for coupled too: fv3_stofs_3d_atl.exe is built with PREC_EVAP. MJ (10/03/26)
#    ops_static_files: true
#    files:
#      sources_json: stofs_3d_atl_river_sources_conus.json
#    st_lawrence:
#      enabled: true
#      # v3.1 ops layout: $COMINlaw/<pdy>/can_streamgauge/, climatology fallback
#      # from the fix dir. MJ (09/28/26)
#      clim_name: stofs_3d_atl_StLawrence_clim.txt
#      csv_name: 02OA016_hydrometric.csv
#      subdir: can_streamgauge

  ocean:
    rtofs_daily_3z: true
    surface_restore:
      enabled: true
      weight_file: stofs_3d_pac_tem_nudge.gr3
      time_smoothing: true
    obc:
      # iettype-4/5 elevation segments only: excludes the iettype-0 St-Lawrence
      # flow segment, so *.th.nc has 778 of the 781 open-boundary nodes (v3.1
      # mesh: 756 + 22 elevation, 3 flow). MJ (09/30/26)
      elev_segments: [0, 1]
      wl_source: RTOFS
      dt: 86400.0
      min_timesteps: 4
      time_smoothing: true
      # TODO: Relevant in pacific?
#      ssh_offset: 0.04
#      obc_mode: dynamic_adjust
      # Ops gen_3Dth chain (non_adjust.sh): same-day RTOFS, 6-hourly records from the
      # nowcast start, triangle interp (mode 1), elev2D held at record 0. MJ (10/02/26)
      ops_timeline: true
      interp_mode: 1
      ssh_hold_first_record: true
      roi_2ds:
        x1: 222
        x2: 2703
        x_stride: 2
        y1: 1051
        y2: 2641
        y_stride: 2
      roi_3dz:
        x1: 222
        x2: 2703
        x_stride: 2
        y1: 1051
        y2: 2641
        y_stride: 2
    nudging:
      enabled: true
      timescale_days: 1.0
      dt: 86400.0
      time_smoothing: true
      roi_3dz:
        x1: 222
        x2: 2703
        x_stride: 2
        y1: 1051
        y2: 2641
        y_stride: 2
    adt:
      enabled: true
      datum_offset: -0.4715517
      weight_file: stofs_3d_pac_adt_weight.nc  # ops ESMF (nearest) map, staged by the fetch tool. MJ (10/02/26)

  tidal:
    create_forcing: 1
    nodal_reference: cycle  # nodal factors over the whole nowcast+forecast, as ops tide_fac. MJ (10/02/26)
    files:
      harmonic_constants_obc: stofs_3d_pac.tidal_hc.nc
      harmonic_constants_ofs: stofs_3d_pac_ufs.bctides.in_template  # FIX name; a bare name resolves to the forecast work copy. MJ (10/01/26)

model:
  physics:
    dt: 90.0
    nws: 4  # NUOPC atmospheric coupling (nws=2 is sflux files)
  run:
    hindcast_days: 1.0
    forecast_days: 3.0
    nowcast_hours: 24
    forecast_hours: 72
    base_date: "2011010100"
  runtime:
    ctl_file: stofs_3d_pac_ufs.param.nml

# TODO: Enable, adjust parameters & test
#ufs_coastal:
