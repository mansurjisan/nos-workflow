#  # Coupled ATL binary (-DAPP=CSTLS -DUSE_ATMOS=ON -DNO_PARMETIS=ON -DOLDIO=ON -DPREC_EVAP=ON, TVD_LIM=VL),
#  # kept apart from SECOFS's fv3_coastalS.exe; the resolver exports it as UFS_EXEC_NAME and
#  # stage_executable fails before the launch when it is not in $EXECnos. MJ (10/03/26)
#  executable: fv3_stofs_3d_atl.exe
