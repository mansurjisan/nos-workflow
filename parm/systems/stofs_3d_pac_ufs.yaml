#  dt_atmos: 900
#
#resources:
#  nprocs: 5032
#  nscribes: 0

# TODO: How different this is from Atlantic?
post:
  archive_fields: true   # run stages normalize + stage global field stacks
  products:
    # points_cwl (surface station series, the ops points.cwl.nc) needs
    # stofs_3d_atl_staout_nc.json/.csv in $FIXofs or it skips; the 3D station
    # profiles come from the profiles product below. MJ (10/05/26)
    - points_cwl
    - fields_nc
    - bias_correct
    # profiles: verified against the S3 ncast profile on PDY 20261001 (161 of
    # 166 stations exact). The other 5 lie outside the mesh, where production
    # writes extrapolated junk; "fill" keeps all 166 in station.in order and
    # writes -99999 for those 5, so indices still line up with ops.
    # geopkg stays off: geopandas + shapely>=1.8 are not in the WCOSS2 python
    # 3.8 module set, and nos-utils geopkg does not yet apply the production
    # isolatedPondNode mask or xGEOID20b datum string. MJ (10/05/26)
    - maxele
    - slab2d
    - adcirc
    - name: profiles
      options:
        outside: fill

shell_mappings:
  variables:
    RUN: system.name
    PREFIXNOS: system.prefix

    GRIDFILE_LL: grid.files.horizontal_ll
    VGRID_CTL: grid.files.vertical
    STA_OUT_CTL: grid.files.station

    DBASE_WL_NOW: forcing.ocean.obc.wl_source
    CREATE_TIDEFORCING: forcing.tidal.create_forcing
    HC_FILE_OBC: forcing.tidal.files.harmonic_constants_obc

    RUNTIME_CTL: model.runtime.ctl_file
    BASE_DATE: model.run.base_date

    RNDAY_NOWCAST: _computed.rnday_nowcast
    RNDAY_FORECAST: _computed.rnday_forecast
    N_DAYS_MODEL_RUN_PERIOD: _computed.total_run_days

    USE_DATM: ufs_coastal.enabled
    UFS_EXEC_NAME: ufs_coastal.executable
    SCHISM_TASKS: ufs_coastal.schism_tasks
    COUPLING_INTERVAL: ufs_coastal.coupling_interval

