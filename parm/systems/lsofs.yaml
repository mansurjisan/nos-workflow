# LSOFS Configuration
# Lake Superior Operational Forecast System
#
# Great Lakes system: no ocean BC, no tides, HRRR primary atmos

_base: fvcom

system:
  name: lsofs
  description: "Lake Superior Operational Forecast System"
  region: great_lakes
  framework: comf
  version: "3.7.0"
  prefix: lsofs
  casename: lsofs

grid:
  type: unstructured
  n_nodes: 20000
  n_elements: 37000
  n_levels: 21
  files:
    horizontal: lsofs_grd.dat
    depth: lsofs_dep.dat
    obc: lsofs_obc.dat
    sigma: lsofs_sigma.dat
    coriolis: lsofs_cor.dat
    sponge: lsofs_spg.dat
    station: lsofs_station.dat
  domain:
    lon_min: -92.5
    lon_max: -84.0
    lat_min: 46.0
    lat_max: 49.0

forcing:
  atmospheric:
    primary: hrrr
    fallback: gfs
    blend_enabled: true
    met_num: 2
    secondary: gfs
    variables:
      - PRMSL
      - TMP
      - SPFH
      - UGRD
      - VGRD
      - PRATE
      - DSWRF
      - DLWRF

  river:
    enabled: true
    primary: nwm
    sources:
      - name: st_louis_river
        usgs_id: "04024000"
        description: "St. Louis River at Scanlon, MN"
      - name: nemadji_river
        usgs_id: "04024430"
        description: "Nemadji River near South Superior, WI"
      - name: bad_river
        usgs_id: "04027000"
        description: "Bad River near Odanah, WI"
      - name: ontonagon_river
        usgs_id: "04040000"
        description: "Ontonagon River near Rockland, MI"

  ocean:
    enabled: false

  tidal:
    enabled: false

model:
  executable: fvcom_lsofs
  ocean_model: FVCOM
  physics:
    dt: 0.5
    dti: 10.0
    isplit: 20
    bottom_roughness: 0.001
    horizontal_mixing: smagorinsky
    vertical_mixing: mellor_yamada25
  vertical:
    kb: 21
    ksl: 1
    p_sigma: 1.0
  run:
    hindcast_days: 0.25
    forecast_days: 5.0

output:
  format: netcdf
  prefix: lsofs
  stations:
    enabled: true
    interval: 360
  fields:
    interval: 3600
  restart:
    interval: 21600

resources:
  nprocs: 360
  memory_gb: 500
  walltime_hours: 2

stages:
  - prep
  - nowcast
  - forecast
  - post

shell_mappings:
  framework: comf
  env_prefix: nos
  variables:
    RUN: system.name
    PREFIXNOS: system.prefix
    OCEAN_MODEL: model.ocean_model
    DELT_MODEL: model.physics.dt
    MINLON: grid.domain.lon_min
    MAXLON: grid.domain.lon_max
    MINLAT: grid.domain.lat_min
    MAXLAT: grid.domain.lat_max
    DBASE_MET_NOW: forcing.atmospheric.primary
    DBASE_MET_NOW2: forcing.atmospheric.secondary
    DBASE_MET_FOR: forcing.atmospheric.primary
    DBASE_MET_FOR2: forcing.atmospheric.secondary
    MET_NUM: forcing.atmospheric.met_num
    TOTAL_TASKS: resources.nprocs
    CREATE_TIDEFORCING: 0
    LEN_FORECAST: 120
