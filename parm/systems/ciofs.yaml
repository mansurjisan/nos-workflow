# CIOFS Configuration
# Cook Inlet Operational Forecast System
#
# Inherits from base ROMS configuration.
# CIOFS covers Cook Inlet in south-central Alaska, known for
# extreme tidal ranges (up to 12m at Anchorage).

_base: roms

system:
  name: ciofs
  description: "Cook Inlet Operational Forecast System"
  region: alaska
  framework: comf
  version: "3.7.0"
  prefix: ciofs

grid:
  type: curvilinear
  n_xi: 200
  n_eta: 300
  n_levels: 30
  files:
    grid: ciofs_grid.nc
    forcing: ciofs_forcing.nc
  # Cook Inlet domain bounds
  domain:
    lon_min: -155.0
    lon_max: -148.0
    lat_min: 58.5
    lat_max: 62.0

forcing:
  atmospheric:
    primary: gfs
    fallback: nam
    variables:
      - Uwind
      - Vwind
      - Pair
      - Tair
      - Qair
      - rain
      - swrad
      - lwrad

  river:
    enabled: true
    primary: nwm
    sources:
      - name: susitna_river
        usgs_id: "15294350"
        description: "Susitna River at Sunshine, AK"
      - name: matanuska_river
        usgs_id: "15284000"
        description: "Matanuska River near Palmer, AK"
      - name: kenai_river
        usgs_id: "15266300"
        description: "Kenai River at Soldotna, AK"

  ocean:
    enabled: true
    primary: rtofs
    obc:
      wl_source: RTOFS
      ts_source: RTOFS

  tidal:
    enabled: true
    database: tpxo9
    constituents:
      - M2
      - S2
      - N2
      - K2
      - K1
      - O1
      - P1
      - Q1

model:
  executable: romsM_ciofs
  ocean_model: ROMS
  physics:
    dt: 4.0
    ndtfast: 30
  vertical:
    n: 30
    vtransform: 2
    vstretching: 4
    theta_s: 5.0
    theta_b: 2.0
    tcline: 20.0
    hc: 20.0
  run:
    hindcast_days: 0.25
    forecast_days: 2.0

output:
  format: netcdf
  prefix: ciofs
  stations:
    enabled: true
    interval: 360
  fields:
    interval: 3600
  restart:
    interval: 21600

resources:
  nprocs: 240
  memory_gb: 400
  walltime_hours: 2

stages:
  - prep
  - nowcast
  - forecast
  - post

shell_mappings:
  framework: comf
  env_prefix: nos
  variables:
    RUN: system.name
    PREFIXNOS: system.prefix
    OCEAN_MODEL: model.ocean_model
    DELT_MODEL: model.physics.dt
    MINLON: grid.domain.lon_min
    MAXLON: grid.domain.lon_max
    MINLAT: grid.domain.lat_min
    MAXLAT: grid.domain.lat_max
    DBASE_MET_NOW: forcing.atmospheric.primary
    DBASE_MET_FOR: forcing.atmospheric.primary
    DBASE_WL_NOW: forcing.ocean.obc.wl_source
    DBASE_WL_FOR: forcing.ocean.obc.wl_source
    DBASE_TS_NOW: forcing.ocean.obc.ts_source
    DBASE_TS_FOR: forcing.ocean.obc.ts_source
    TOTAL_TASKS: resources.nprocs
    CREATE_TIDEFORCING: 1
    LEN_FORECAST: 48
