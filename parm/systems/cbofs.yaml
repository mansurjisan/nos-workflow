# CBOFS Configuration

_base: roms

system:
  name: cbofs
  description: "Chesapeake Bay Operational Forecast System"
  region: chesapeake
  framework: comf
  version: "3.7.0"
  prefix: cbofs

execution:
  mode: standalone

grid:
  type: curvilinear
  files:
    grid: cbofs_grid.nc
    forcing: cbofs_forcing.nc
  domain:
    lon_min: -77.5
    lon_max: -75.0
    lat_min: 36.5
    lat_max: 39.7

forcing:
  atmospheric:
    primary: nam
    fallback: gfs
    variables:
      - Uwind
      - Vwind
      - Pair
      - Tair
      - Qair
      - rain
      - swrad
      - lwrad

  river:
    enabled: true
    primary: nwm
    sources:
      - name: susquehanna
        usgs_id: "01578310"
      - name: potomac
        usgs_id: "01646500"
      - name: james
        usgs_id: "02037500"

  ocean:
    enabled: true
    primary: rtofs
    obc:
      wl_source: RTOFS
      ts_source: RTOFS

  tidal:
    enabled: true
    constituents:
      - M2
      - S2
      - N2
      - K2
      - K1
      - O1
      - P1
      - Q1

model:
  ocean_model: ROMS
  physics:
    dt: 4.0
    ndtfast: 20
  run:
    hindcast_days: 0.25
    forecast_days: 2.0

output:
  format: netcdf
  prefix: cbofs
  stations:
    enabled: true
    interval: 360
  fields:
    interval: 3600
  restart:
    interval: 21600

resources:
  nprocs: 120
  memory_gb: 200
  walltime_hours: 1

stages:
  - prep
  - nowcast
  - forecast
  - post

shell_mappings:
  framework: comf
  env_prefix: nos
  variables:
    RUN: system.name
    PREFIXNOS: system.prefix
    OCEAN_MODEL: model.ocean_model

    MINLON: grid.domain.lon_min
    MAXLON: grid.domain.lon_max
    MINLAT: grid.domain.lat_min
    MAXLAT: grid.domain.lat_max

    DBASE_MET_NOW: forcing.atmospheric.primary
    DBASE_MET_FOR: forcing.atmospheric.primary

    DBASE_TS_NOW: forcing.ocean.obc.ts_source
    DBASE_TS_FOR: forcing.ocean.obc.ts_source

    DELT_MODEL: model.physics.dt

    TOTAL_TASKS: resources.nprocs
