# STOFS 3D Atlantic Configuration
# Storm Surge and Tide Operational Forecast System - 3D Atlantic
#
# Inherits from base SCHISM configuration and overrides specific values.
# This config maps to STOFS shell script environment variables.

_base: schism

system:
  name: stofs_3d_atl
  description: "Storm Surge and Tide Operational Forecast System - 3D Atlantic"
  region: atlantic
  framework: stofs
  version: "3.1.1"
  # Shell prefix for file naming (RUN in nosofs, used as prefix)
  prefix: stofs_3d_atl

# Grid configuration - maps to shell variables
grid:
  type: unstructured
  # SCHISM grid dimensions
  n_nodes: 1813443           # -> np_global
  n_elements: 3564104        # -> ne_global
  n_sides: 5377546           # -> ns_global
  n_levels: 51               # -> nvrt, KBm
  files:
    horizontal: stofs_3d_atl.hgrid.gr3    # -> GRIDFILE
    vertical: stofs_3d_atl.vgrid.in       # -> VGRID_CTL
    horizontal_ll: stofs_3d_atl.hgrid.ll  # -> GRIDFILE_LL
  # Domain bounds - STOFS hardcoded values
  # Maps to: LONMIN, LONMAX, LATMIN, LATMAX (STOFS)
  # or MINLON, MAXLON, MINLAT, MAXLAT (nosofs)
  domain:
    lon_min: -98.5035
    lon_max: -52.4867
    lat_min: 7.347
    lat_max: 52.5904

# Forcing configuration
forcing:
  atmospheric:
    primary: gfs             # -> DBASE_MET_NOW, DBASE_MET_FOR
    fallback: null
    gfs:
      resolution: "0.25"     # GFS 0.25 degree
      levels: [10, 2]        # Heights for wind (10m), temp/humidity (2m)
    variables:
      - PRMSL                # Pressure reduced to MSL
      - TMP                  # Temperature
      - SPFH                 # Specific humidity
      - RH                   # Relative humidity
      - UGRD                 # U-component of wind
      - VGRD                 # V-component of wind
      - PRATE                # Precipitation rate
      - DSWRF                # Downward shortwave radiation flux
      - DLWRF                # Downward longwave radiation flux
    # HRRR blending for high-resolution coastal
    hrrr_blend:
      enabled: true
      domain: conus
      resolution: "3km"
      # HRRR domain bounds (different from GFS)
      lon_min: -98.5
      lon_max: -49.5
      lat_min: 5.5
      lat_max: 50.0
    # NAM blending for ensemble atmospheric forcing
    # NAM domain does NOT cover full STOFS domain (lat ~14-43N vs ~7-53N)
    # Used only as secondary source (sflux stack 2) by ensemble members
    nam_blend:
      enabled: false            # Only used by ensemble members
      resolution: "12km"
      lon_min: -89.15
      lon_max: -58.17
      lat_min: 14.34
      lat_max: 42.61

  river:
    enabled: true
    primary: nwm              # National Water Model -> DBASE_RIVER="NWM"
    n_rivers: 7690            # Total river sources
    version: "v3.0"
    # Target number of NWM files to process (126hr forecast + 6hr nowcast)
    n_list_target: 121        # -> N_list_target: 121*3600/86400=1+4.0417 days
    n_list_min: 97            # -> N_list_min: minimum files needed (121-24)
    # Files for river forcing
    files:
      sources_json: stofs_3d_atl_river_sources_conus.json  # v3.1.1: VIMS v7 simplified (no relocation/scaling)
    # St. Lawrence River from Canadian data
    st_lawrence:
      enabled: true
      source: DCOMROOT
      clim_file: stofs_3d_atl_st_lawrence_river_clim.nc

  ocean:
    enabled: true
    primary: rtofs            # -> DBASE_TS_NOW, DBASE_TS_FOR = "RTOFS"
    # Open boundary settings
    obc:
      # SSH (water level) data source
      wl_source: rtofs        # -> DBASE_WL_NOW, DBASE_WL_FOR
      ts_source: rtofs        # Temperature/Salinity source
      ssh_offset: 0.04        # SSH offset correction (meters)
      obc_mode: dynamic_adjust  # non_adjust or dynamic_adjust
      # Target number of RTOFS files (126hr/6hr = 21 points)
      n_list_target_2d: 21    # -> N_list_target_2D
      n_list_target_3d: 21    # -> N_list_target_3D
      # RTOFS region of interest indices for subsetting
      # 2D surface fields (ssh)
      roi_2ds:
        x1: 2805              # -> idx_x1_2ds
        x2: 2923              # -> idx_x2_2ds
        y1: 1598              # -> idx_y1_2ds
        y2: 2325              # -> idx_y2_2ds
      # 3D fields (temp, salt, velocity)
      roi_3dz:
        x1: 482               # -> idx_x1_3dz
        x2: 600               # -> idx_x2_3dz
        y1: 94                # -> idx_y1_3dz
        y2: 821               # -> idx_y2_3dz
    nudging:
      enabled: true
      timescale_days: 1.0
      # ROI for nudge file generation (slightly different from OBC 3D TH)
      roi_3dz:
        x1: 422               # -> idx_x1_3dz_nudge
        x2: 600               # -> idx_x2_3dz_nudge
        y1: 94                # -> idx_y1_3dz_nudge
        y2: 835               # -> idx_y2_3dz_nudge
      files:
        sal_nudge: stofs_3d_atl.SAL_nudge.gr3
        tem_nudge: stofs_3d_atl.TEM_nudge.gr3
    # ADT satellite data for SSH boundary correction
    adt:
      enabled: true
      satellite: jason3

  tidal:
    enabled: true
    database: tpxo9
    # -> CREATE_TIDEFORCING = 1
    constituents:
      - M2
      - S2
      - N2
      - K2
      - K1
      - O1
      - P1
      - Q1
    files:
      bctides_template: bctides.in_template
      harmonic_constants: stofs_3d_atl.tidal_hc.nc  # -> HC_FILE_OBC

# Model physics and runtime configuration
model:
  executable: pschism_WCOSS2
  physics:
    dt: 150.0                 # Timestep in seconds -> DELT_MODEL
    slam0: -77.0              # Reference longitude
    sfea0: 35.0               # Reference latitude
    # Additional SCHISM parameters
    nws: 2                    # Atmospheric forcing format
    wtiminc: 3600             # Wind time increment (seconds)
  run:
    # STOFS: split nowcast + forecast (two separate SCHISM runs)
    hindcast_days: 1.0        # 24-hour nowcast (lookback from cycle time)
    forecast_days: 4.5        # 4.5-day forecast (108 hours)
    nowcast_hours: 24
    forecast_hours: 108
    # Total simulation coverage = 24h + 108h = 5.5 days (unchanged)

# Output configuration
output:
  format: netcdf
  # File naming prefix
  prefix: stofs_3d_atl
  stations:
    enabled: true
    interval: 360.0           # 6 minutes -> NSTA
    file: stofs_3d_atl.station.in
  fields_2d:
    enabled: true
    interval: 3600.0          # 1 hour
    variables:
      - elevation
      - dahv                  # Depth-averaged horizontal velocity
      - windSpeedX
      - windSpeedY
  fields_3d:
    enabled: true
    interval: 3600.0
    variables:
      - salinity
      - temperature
      - horizontalVelX
      - horizontalVelY
      - zCoordinates
      - verticalVelocity    # v3.1.1: new output variable
      - diffusivity          # v3.1.1: new output variable
  # Restart/hotstart output
  restart:
    interval_days: 1.0        # Daily restart files -> NRST

# Computational resources for STOFS-3D-ATL
# nprocs is the TOTAL mpiexec -n rank count (compute + scribes), matching
# the legacy semantic used by SECOFS/creofs/stofs_2d_atl.
# Constraint: nprocs - nscribes MUST equal partition.prop's compute-rank
# count (offline METIS decomposition). For v3.1.1 partition.prop = 4912
# compute ranks, so nprocs = 4912 + 8 = 4920.
# PBS allocation must provide at least nprocs cores (39x128=4992 satisfies).
resources:
  nprocs: 4920                # total mpiexec -n (compute + scribes)
  nscribes: 8                 # SCHISM scribed-I/O ranks (v3.1.1)
  pbs_select: "select=39:ncpus=128:mpiprocs=128"   # documentation only; PBS file must match
  walltime_hours: 2
  memory_gb: 2000

# STOFS workflow stages (different from nosofs)
stages:
  - prep
  - nowcast                  # Separate nowcast run
  - forecast                 # Separate forecast run
  - post_1                   # 2D field extraction
  - post_2                   # Final products (ADCIRC format, GeoPackage)
  - temp_salt_restart        # T/S restart for next cycle

# Ensemble configuration for uncertainty quantification
# Method: gefs - GEFS atmospheric forcing ensemble + physics perturbation
# Member 000 is always the control run (GFS deterministic + default params)
# Members 001+ use GEFS perturbation members + LHS-perturbed physics
ensemble:
  enabled: true
  n_members: 6
  method: gefs
  seed: 42                          # Reproducible sampling
  # GEFS (Global Ensemble Forecast System) atmospheric forcing configuration
  # Uses 0.25 deg pgrb2sp25 product (has all 8 sflux variables)
  # Control member uses GFS deterministic (0.25 deg) + HRRR coastal blending
  # Perturbed members use GEFS-only (no HRRR) to preserve ensemble spread at coast
  gefs:
    enabled: true
    n_gefs_members: 5
    resolution: "0p25"
    product: "pgrb2sp25"
    control_member: "gec00"
    perturbation_prefix: "gep"
    members:
      "000":
        label: "control (GFS+HRRR)"
        met_source_1: GFS
        met_source_2: HRRR
      "001":
        label: "GEFS p01"
        met_source_1: GEFS_01
        met_source_2: null
      "002":
        label: "GEFS p02"
        met_source_1: GEFS_02
        met_source_2: null
      "003":
        label: "GEFS p03"
        met_source_1: GEFS_03
        met_source_2: null
      "004":
        label: "GEFS p04"
        met_source_1: GEFS_04
        met_source_2: null
      "005":
        label: "RRFS"
        met_source_1: RRFS
        met_source_2: null
    extra_sources:
      - GEFS_01
      - GEFS_02
      - GEFS_03
      - GEFS_04
      - RRFS
  # RRFS (Rapid Refresh Forecast System) atmospheric forcing configuration
  # 3km resolution, North America domain, available on WCOSS2 at para status
  # Path: /lfs/h1/ops/para/com/rrfs/v1.0/rrfs.YYYYMMDD/HH/rrfs.tHHz.prslev.3km.fFFF.na.grib2
  # Note: RRFS does NOT have PRMSL — uses MSLET instead (forcing script handles this)
  # STOFS-3D-ATL forecast is 108h but RRFS covers 84h at main cycles;
  # hours beyond 84 fall back to GFS.
  rrfs:
    enabled: true
    resolution: "3km"
    domain: "na"                    # North America
    max_forecast_hours: 84          # At main cycles (00/06/12/18Z)
    fallback_source: GFS            # For hours beyond RRFS coverage (84h < 108h forecast)
    version: "v1.0"
    status: "para"                  # Not yet in prod
  # Physics perturbation via Latin Hypercube Sampling (members 001+)
  # Set to false for GEFS-only ensemble (atmospheric forcing differences only)
  perturb_physics: true
  # Member 000 (control) always uses default physics values
  parameters:
    rdrg2:
      min: 0.001
      max: 0.01
      default: 0.005
      distribution: uniform         # Uniform sampling in linear space
      description: "Bottom drag coefficient"
    zob:
      min: 0.0001
      max: 0.001
      default: 0.0005
      distribution: log_uniform     # Uniform sampling in log space
      description: "Bottom roughness length (m)"
    akt_bak:
      min: 1.0e-6
      max: 1.0e-5
      default: 5.0e-6
      distribution: log_uniform
      description: "Background tracer diffusivity (m2/s)"
  # Ensemble-specific resources (per member)
  # Must match partition.prop's compute-rank count + nscribes.
  resources:
    select: "select=39:ncpus=128:mpiprocs=128"
    walltime: "06:00:00"
    total_tasks: 4920   # 4912 compute (== partition.prop) + 8 scribes
    nscribes: 8
  # Ensemble post-processing resources
  post_resources:
    select: "select=1:ncpus=8:mpiprocs=8"
    walltime: "01:00:00"

# Legacy shell script execution configuration
# When enabled, Python workflow calls the original STOFS shell scripts
# instead of native Python implementations
legacy:
  enabled: true                   # Use legacy shell scripts
  # Path to STOFS ush directory (auto-detected from HOMEstofs if not set)
  ush_dir: ""
  # Path to pysh directory for Python helper scripts
  pysh_dir: ""
  # Path to FIX files (auto-detected from FIXstofs3d if not set)
  fix_dir: ""
  # Individual script toggles (override global enabled flag)
  scripts:
    gfs: true                     # stofs_3d_atl_create_surface_forcing_gfs.sh
    hrrr: true                    # stofs_3d_atl_create_surface_forcing_hrrr.sh
    nam: true                     # stofs_3d_atl_create_surface_forcing_nam.sh (ensemble only)
    rrfs: true                    # stofs_3d_atl_create_surface_forcing_rrfs.sh (ensemble only)
    river: true                   # stofs_3d_atl_create_river_forcing_nwm.sh
    obc: true                     # stofs_3d_atl_create_obc_3d_th_non_adjust.sh + _dynamic_adjust.sh
    tides: true                   # stofs_3d_atl_create_bctides_in.sh
  # Custom script names (if different from defaults)
  script_names:
    gfs: stofs_3d_atl_create_surface_forcing_gfs.sh
    hrrr: stofs_3d_atl_create_surface_forcing_hrrr.sh
    nam: stofs_3d_atl_create_surface_forcing_nam.sh
    rrfs: stofs_3d_atl_create_surface_forcing_rrfs.sh
    river: stofs_3d_atl_create_river_forcing_nwm.sh
    obc_non_adjust: stofs_3d_atl_create_obc_3d_th_non_adjust.sh      # v3.1.1: split from obc_3d_th.sh
    obc_dynamic_adjust: stofs_3d_atl_create_obc_3d_th_dynamic_adjust.sh  # v3.1.1: bias correction
    tides: stofs_3d_atl_create_bctides_in.sh

# Environment variable mappings for shell scripts
# These help yaml_to_env.py generate correct shell variables
shell_mappings:
  # STOFS specific environment variables
  framework: stofs
  env_prefix: stofs3d        # For HOMEstofs3d, FIXstofs3d, etc.
  # Map YAML paths to shell variable names
  variables:
    # Model identification
    OCEAN_MODEL: model.ocean_model
    DELT_MODEL: model.physics.dt

    # Grid files
    GRIDFILE: grid.files.horizontal
    VGRID_CTL: grid.files.vertical

    # Grid dimensions
    nvrt: grid.n_levels
    KBm: grid.n_levels
    np_global: grid.n_nodes
    ne_global: grid.n_elements
    ns_global: grid.n_sides

    # GFS domain bounds (primary forcing)
    LONMIN: grid.domain.lon_min
    LONMAX: grid.domain.lon_max
    LATMIN: grid.domain.lat_min
    LATMAX: grid.domain.lat_max

    # HRRR domain bounds (for blending)
    HRRR_LONMIN: forcing.atmospheric.hrrr_blend.lon_min
    HRRR_LONMAX: forcing.atmospheric.hrrr_blend.lon_max
    HRRR_LATMIN: forcing.atmospheric.hrrr_blend.lat_min
    HRRR_LATMAX: forcing.atmospheric.hrrr_blend.lat_max

    # NAM domain bounds (for ensemble atmospheric forcing)
    NAM_LONMIN: forcing.atmospheric.nam_blend.lon_min
    NAM_LONMAX: forcing.atmospheric.nam_blend.lon_max
    NAM_LATMIN: forcing.atmospheric.nam_blend.lat_min
    NAM_LATMAX: forcing.atmospheric.nam_blend.lat_max

    # River forcing parameters
    N_RIVERS: forcing.river.n_rivers
    N_list_target: forcing.river.n_list_target
    N_list_min: forcing.river.n_list_min

    # RTOFS OBC parameters
    N_list_target_2D: forcing.ocean.obc.n_list_target_2d
    N_list_target_3D: forcing.ocean.obc.n_list_target_3d
    idx_x1_2ds: forcing.ocean.obc.roi_2ds.x1
    idx_x2_2ds: forcing.ocean.obc.roi_2ds.x2
    idx_y1_2ds: forcing.ocean.obc.roi_2ds.y1
    idx_y2_2ds: forcing.ocean.obc.roi_2ds.y2
    idx_x1_3dz: forcing.ocean.obc.roi_3dz.x1
    idx_x2_3dz: forcing.ocean.obc.roi_3dz.x2
    idx_y1_3dz: forcing.ocean.obc.roi_3dz.y1
    idx_y2_3dz: forcing.ocean.obc.roi_3dz.y2
    SSH_OFFSET: forcing.ocean.obc.ssh_offset
    OBC_MODE: forcing.ocean.obc.obc_mode

    # RTOFS nudge parameters (slightly different ROI from OBC)
    idx_x1_3dz_nudge: forcing.ocean.nudging.roi_3dz.x1
    idx_x2_3dz_nudge: forcing.ocean.nudging.roi_3dz.x2
    idx_y1_3dz_nudge: forcing.ocean.nudging.roi_3dz.y1
    idx_y2_3dz_nudge: forcing.ocean.nudging.roi_3dz.y2

    # Computed values (derived at runtime)
    LEN_NOWCAST: _computed.len_nowcast_hours
    LEN_FORECAST: _computed.len_forecast_hours
    N_DAYS_MODEL_RUN_PERIOD: _computed.total_run_days
    RNDAY_NOWCAST: _computed.rnday_nowcast
    RNDAY_FORECAST: _computed.rnday_forecast
