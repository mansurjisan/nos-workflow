# SECOFS UFS-Coastal Configuration -- DATM+SCHISM+WW3 (4-component)
# Southeast Coastal Ocean Forecast System with wave coupling.
#
# Inherits secofs_ufs.yaml wholesale (mesh, forcing, prep, tidal, physics)
# and only overrides what the wave component adds. system.prefix is
# intentionally NOT overridden -- it stays "secofs_ufs" so this variant
# reuses the exact same SCHISM-side fix filenames (hgrid.gr3, bctides.in,
# nudging, river, tidal) as secofs_ufs; only $FIXofs itself differs
# (fix/secofs_ufs_ww3/, keyed off system.name). WCOSS2 deployment must
# populate that directory with the same secofs_ufs.* mesh/forcing statics
# (copied or symlinked from fix/secofs_ufs/) alongside the wave-only files
# this repo tracks in git.
#
# Cycling design (hybrid): SCHISM continues to cycle via its own hotstart
# (ihot=1, unchanged from secofs_ufs). WW3 and the CMEPS mediator instead
# cycle via CMEPS netCDF restarts (ufs.cpld.{ww3,cpl}.r.*.nc) + rpointer.cpl,
# written at the end of each cycle's nowcast leg and read back by that same
# cycle's forecast leg (start_type=continue -- see
# runners/schism_ufs/configure.py patch_ufs_configure).

_base: secofs_ufs

system:
  name: secofs_ufs_ww3
  description: "Southeast Coastal Ocean Forecast System (UFS-Coastal, DATM+SCHISM+WW3)"

# UFS-Coastal coupling configuration -- 4-component overrides only.
# datm_tasks/schism_tasks/datm_domain/blend_*/templates/etc. are unchanged,
# inherited from secofs_ufs.
ufs_coastal:
  # WAV PETs 2914-7679 (4766 PETs), sized for the mesh actually being
  # shipped -- the repaired E=5 elevation-filtered mesh (1,299,007 nodes /
  # 2,505,554 elements), not the smaller OCSMesh-coarsened mesh the
  # original 686-PET figure assumed (that mesh was never built). Scaled
  # from the only validated wave-PET data point, the Alaska
  # DATM+SCHISM+WW3 config (4900 WAV PETs / 1,343,182 nodes = 274.12
  # nodes/PET): 1,299,007 / 274.12 ~= 4740 PETs, rounded up to 4766 so
  # datm+schism+wav lands exactly on a whole node count (datm=120 +
  # schism=2794 + wav=4766 = total=7680, 64 nodes @ 120 ppn exactly, 0
  # idle slots). This is a single-data-point extrapolation -- re-tune
  # after a WCOSS2 profiling pass. See nos-utils
  # UFSConfigProcessor._patch_pet_bounds for the PET-bounds patch this
  # drives and the datm+schism+wav==total cross-check it enforces at prep
  # time.
  wav_tasks: 4766
  total_tasks: 7680
  # NUOPC runSeq coupling interval (seconds). Must be an integer multiple
  # of model.physics.dt (120s here -- 360 = 3 SCHISM steps); enforced by
  # nos-utils UFSConfigProcessor._patch_runseq_interval.
  coupling_interval: 360
  wav_model: ww3
  # Must match the WAV_attributes::mesh_wav line in fix/secofs_ufs_ww3/ufs.configure.
  wav_mesh: secofs_ufs.mesh_wav.nc
  # Companion "GRID%NML" auxiliary namelist ww3_grid.nml points at (solver
  # flags for the implicit-PDLIB run). Staged defensively at runtime in
  # case ww3_shel/ww3_multi re-reads it directly; see stage_wave_configs.
  wav_pdlib_namelist: secofs_ufs_ww3.namelists_pdlib.nml
  # Precomputed ocn->wav regrid weight file (ESMF_FieldSMMStore format:
  # n_s-dimensioned row/col/S). Keeps ESMF from building an internal dual
  # of SCHISM's mesh for the bilinear map at runtime, which aborts at this
  # mesh size -- see the ocn2wav_smapname comment in
  # fix/secofs_ufs_ww3/ufs.configure, which this value must match.
  # Prefixed in both $FIXofs and $DATA (like wav_mesh, not mod_def.ww3's
  # bare-name staging) because CMEPS opens this exact attribute string
  # with a plain nf90_open against the run directory.
  # The generated file is NETCDF4/HDF5; that opens fine under
  # ESMF_FactorRead on WCOSS2's netCDF-4-enabled ESMF build. If a
  # portability problem with that format ever surfaces, NETCDF3_64BIT is
  # the maximally conservative container to regenerate it in.
  ocn2wav_weights: secofs_ufs.ocn2wav_weights.nc

# GFS-Wave boundary spectra (nos-utils WaveBoundaryProcessor). Deep-merges
# onto secofs_ufs's forcing block -- atmospheric/river/tidal/ocean stay
# inherited unchanged; this is the only new forcing key this variant adds.
# Builds nest.ww3 per cycle from the operational gfswave IBP tarball, the
# same pipeline already driving STOFS-3D-AK's wave-coupled variant.
forcing:
  waves:
    enabled: true
    # A direct census of NOAA-EMC/global-workflow's operational
    # wave_gfs.buoys point registry (4,297 points total, filtered to
    # TYPE==IBP) shows continuous WFO-tagged coastal coverage the full
    # length of the SECOFS open boundary: NC (NW-MHX, NW-ILM) down
    # through the FL peninsula (JAX, MLB, MIA, KEY, TBW), around the
    # Gulf coast to LA (PCB, MOB, LIX), plus San Juan PR (SJU) bracketing
    # the PR/USVI segment -- roughly 400+ IBP points fall inside the
    # window below, spaced on the order of 0.1-0.5 degrees along the
    # coast. That is denser than the 214 IBP points the AK bring-up
    # found inside its own window, on a comparably sized boundary.
    #
    # The mesh's own open-boundary extent (extracted from the real
    # hgrid.gr3; both open segments) is lon -87.09..-64.00,
    # lat 17.54..37.92. The window below adds a 2-4 degree margin on
    # every side -- enough to comfortably bracket that dense WFO network
    # without reaching so far out that it pulls in unrelated open-ocean
    # point groups. (A few incidental non-coastal points from other WFO
    # regions do fall inside this box too; harmless -- ww3_bound selects
    # each boundary node's two nearest input points by raw distance
    # [ww3_bound.F90 W3BOUNC-equivalent DIST calc], not by list order,
    # so a farther-off point already staged among the extracted spectra
    # never wins over a genuinely nearer coastal one.)
    window:
      lon_min: -91.0
      lon_max: -61.0
      lat_min: 16.0
      lat_max: 40.0
    # No extra_points: AK needed 3 general NDBC buoys (46070/46071/46035)
    # to backfill a real, zero-IBP-coverage gap along its western
    # Aleutian arc. The same census shows no comparable gap here -- both
    # SECOFS boundary segments have continuous IBP coverage end to end,
    # so there is nothing in spec_tar.gz worth naming explicitly.
    #
    # points_file must be a wave_gfs.buoys-format point list (the exact
    # format the census above parsed). The real WCOSS2 location was not
    # confirmed here -- follow the same precedent stofs_3d_ak_ufs_ww3.yaml
    # left this at: a bare name, resolved against $FIXofs the same way
    # grid_file/bctides_template already are, that the operator must
    # stage before this system's first wave-enabled prep (e.g. a copy of
    # the gfswave app's own operational wave_gfs.buoys). Until staged,
    # WaveBoundaryProcessor logs a non-fatal "points_file not found"
    # warning and produces no nest.ww3 -- see the critical_sources note
    # below.
    points_file: secofs_ufs.ww3_bound_points.list
    # How many additional 6h GFS-Wave cycles to walk back if the newest
    # cycle's ibp_tar/spec_tar.gz aren't posted yet. Not empirically
    # tuned (AK's own config left this as an open question too) -- 2
    # tolerates one missed/late post (12h) without reaching so far back
    # that the swell field served is stale enough to be meaningless.
    max_cycle_fallback: 2

# Wave BC is deliberately NOT added to prep.critical_sources (this system
# doesn't declare that key at all, so it inherits secofs_ufs's legacy
# heuristic {GFS, PARAM_NML, TIDAL}). A missing/failed nest.ww3 therefore
# degrades prep rather than failing it: WaveBoundaryProcessor's [FAIL]
# result still logs loudly in the prep summary (PrepResult.summary()),
# but does not flip overall success. At run time this matches WW3's own
# behavior with no nest.ww3 present (verified against the vendored WW3
# source, w3iobcmd.F90): the boundary-file OPEN failure is caught, FLBPI
# is set to .FALSE., and the run continues with a logged warning --
# "BOUNDARY CONDITIONS WILL NOT BE UPDATED" -- rather than aborting, i.e.
# wind-sea-only, not a crash. This is the intended bring-up posture; make
# WAVE_BC critical only once the pipeline has proven itself operationally.

# UFS-Coastal coupled executable, wave-enabled build.
model:
  executable: fv3_coastalSW.exe
  runtime:
    # Wave variant carries its own param.nml: adds RADFLAG='LON' and
    # flips fwvor_breaking 1->0 (USE_WW3 coupling block) relative to
    # secofs_ufs.param.nml. See fix/secofs_ufs_ww3/secofs_ufs_ww3.param.nml.
    ctl_file: secofs_ufs_ww3.param.nml

# Computational resources (DATM + SCHISM + WW3).
resources:
  nprocs: 7680
  nscribes: 0
  select: "select=64:ncpus=128:mpiprocs=120:ompthreads=1"
  # UNVERIFIED: naive linear scale from secofs_ufs's 1500 GB @ 2914 tasks
  # gives ~3953 GB @ 7680 tasks, but WW3's implicit-PDLIB solver keeps a
  # full 2D spectrum (32 freq x 36 dir bins) resident per wave-mesh node --
  # a different memory profile than SCHISM's transport arrays, and the WAV
  # PET count itself is a single-data-point extrapolation (see wav_tasks
  # above). Treat this as a starting point pending a WCOSS2 profiling
  # pass, not a sized value.
  memory_gb: 4000
  # walltime_hours unchanged: more WAV PETs only shortens WW3's per-step
  # cost (better parallelism on the same mesh); it does not add work to
  # SCHISM/DATM, which set the pace for the leg. Re-check once a real
  # wave-coupled cycle has run at this PET count.
  walltime_hours: 2

# Ensemble disabled for the initial wave-coupled cut: the GEFS ensemble
# resources block (select=, nprocs) is sized for secofs_ufs's 3-component
# 2914-task layout and would under-allocate the 7680-task wave layout.
ensemble:
  enabled: false

# Env var mappings -- additive only (dict-merged onto secofs_ufs's
# shell_mappings.variables; every existing mapping is inherited unchanged).
shell_mappings:
  variables:
    WAV_TASKS: ufs_coastal.wav_tasks
    WAV_MESH: ufs_coastal.wav_mesh
    WAV_PDLIB_NML: ufs_coastal.wav_pdlib_namelist
    WAV_OCN2WAV_WEIGHTS: ufs_coastal.ocn2wav_weights
    # Consumed by execute._validate_wave_ufs_configure's pre-MPI-launch
    # sanity check (the runSeq @<interval> line staged into ufs.configure
    # must match this).
    COUPLING_INTERVAL: ufs_coastal.coupling_interval
