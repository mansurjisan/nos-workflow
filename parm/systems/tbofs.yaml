# TBOFS Configuration
# Tampa Bay Operational Forecast System
#
# Inherits from base ROMS configuration and overrides specific values.
# Reference: nosofs.v3.7.0/fix/tbofs.ctl

_base: roms

system:
  name: tbofs
  description: "Tampa Bay Operational Forecast System"
  region: gulf_coast
  framework: comf
  version: "3.7.0"
  prefix: tbofs

# Grid configuration - ROMS curvilinear grid
grid:
  type: curvilinear
  n_xi: 120
  n_eta: 180
  n_levels: 20
  files:
    grid: tbofs_grid.nc
    forcing: tbofs_forcing.nc
  # Tampa Bay domain bounds
  domain:
    lon_min: -83.2
    lon_max: -82.0
    lat_min: 27.0
    lat_max: 28.4

# Forcing configuration
forcing:
  atmospheric:
    primary: nam
    fallback: gfs
    variables:
      - Uwind
      - Vwind
      - Pair
      - Tair
      - Qair
      - rain
      - swrad
      - lwrad

  river:
    enabled: true
    primary: nwm
    sources:
      - name: hillsborough_river
        usgs_id: "02304500"
        description: "Hillsborough River near Tampa, FL"
      - name: alafia_river
        usgs_id: "02301500"
        description: "Alafia River at Lithia, FL"
      - name: little_manatee_river
        usgs_id: "02300500"
        description: "Little Manatee River near Wimauma, FL"
      - name: manatee_river
        usgs_id: "02299950"
        description: "Manatee River near Myakka Head, FL"

  ocean:
    enabled: true
    primary: rtofs
    obc:
      wl_source: RTOFS
      ts_source: RTOFS

  tidal:
    enabled: true
    database: tpxo9
    constituents:
      - M2
      - S2
      - N2
      - K2
      - K1
      - O1
      - P1
      - Q1

# Model physics
model:
  executable: romsM_tbofs
  ocean_model: ROMS
  physics:
    dt: 3.0                     # DELT_MODEL
    ndtfast: 20
  vertical:
    n: 20
    vtransform: 2
    vstretching: 4
    theta_s: 5.0
    theta_b: 0.4
    tcline: 10.0
    hc: 10.0
  run:
    hindcast_days: 0.25
    forecast_days: 2.0

# Static input files
static_files:
  grid: tbofs_grid.nc
  grid_forcing: tbofs_forcing.nc
  river_ctl: tbofs.river.ctl
  river_clim: nos.river.clim.usgs.nc
  obc_ctl: tbofs.obc.ctl
  obc_clim: nos.clim.WOA05.nc
  station_in: tbofs.station.in
  runtime_ctl: tbofs.ocean.in
  hc_file_obc: tbofs.HC.nc

# Output configuration
output:
  format: netcdf
  prefix: tbofs
  stations:
    enabled: true
    interval: 360
  fields:
    interval: 3600
  restart:
    interval: 21600

# Computational resources
resources:
  nprocs: 120
  memory_gb: 200
  walltime_hours: 1

# COMF workflow stages
stages:
  - prep
  - nowcast
  - forecast
  - post

# Environment variable mappings
shell_mappings:
  framework: comf
  env_prefix: nos
  variables:
    RUN: system.name
    PREFIXNOS: system.prefix
    OCEAN_MODEL: model.ocean_model
    DELT_MODEL: model.physics.dt
    MINLON: grid.domain.lon_min
    MAXLON: grid.domain.lon_max
    MINLAT: grid.domain.lat_min
    MAXLAT: grid.domain.lat_max
    DBASE_MET_NOW: forcing.atmospheric.primary
    DBASE_MET_FOR: forcing.atmospheric.primary
    DBASE_WL_NOW: forcing.ocean.obc.wl_source
    DBASE_WL_FOR: forcing.ocean.obc.wl_source
    DBASE_TS_NOW: forcing.ocean.obc.ts_source
    DBASE_TS_FOR: forcing.ocean.obc.ts_source
    TOTAL_TASKS: resources.nprocs
    CREATE_TIDEFORCING: 1
    LEN_FORECAST: 48
    IGRD_MET: 0
    IGRD_OBC: 0
