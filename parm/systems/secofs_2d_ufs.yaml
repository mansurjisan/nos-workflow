# SECOFS 2D Barotropic UFS-Coastal Configuration
# Southeast Coastal Ocean Forecast System - 2D Barotropic (DATM+SCHISM coupled)
#
# Derived from secofs_ufs.yaml (3D baroclinic) with barotropic simplifications.
# Key differences from the 3D version:
#   - n_levels: 2 (barotropic, was 63)
#   - itur: 0 (no turbulence closure needed for 2D)
#   - No T/S ocean boundary conditions (ts_source: null)
#   - No T/S nudging (nudging.enabled: false)
#   - No 3D field output (fields_3d.enabled: false)
#   - Reduced task count: 560 total (60 DATM + 500 SCHISM, was 1200)
#   - 15-member GEFS atmospheric ensemble (14 GEFS perturbation members + 1 control)
#   - No physics perturbation (atmospheric-only ensemble)
#
# The horizontal grid is identical to the 3D SECOFS UFS system (1.68M nodes).
# Barotropic mode drastically reduces memory and runtime since no tracer arrays
# are allocated and no vertical mixing/transport is computed.

_base: schism

system:
  name: secofs_2d_ufs
  description: "Southeast Coastal Ocean Forecast System - 2D Barotropic (UFS-Coastal)"
  region: southeast_coast
  framework: comf
  version: "3.7.0"
  prefix: secofs_2d_ufs

# Grid configuration - identical horizontal grid to 3D secofs_ufs, 2 vertical levels
# Values from secofs.ctl
grid:
  type: unstructured
  n_nodes: 1684786
  n_elements: 3322329
  n_sides: 5007180
  n_levels: 2                    # Barotropic: 2 vertical levels (was 63 in 3D)
  files:
    horizontal: secofs_2d_ufs.hgrid.gr3
    vertical: secofs_2d_ufs.vgrid.in
    vertical_nu: secofs_2d_ufs.vgrid.nu.in
    vertical_fake: secofs_2d_ufs.vgrid.fake.in
    horizontal_ll: secofs_2d_ufs.hgrid.ll
    shapiro: secofs_2d_ufs.shapiro.gr3
    diffmin: secofs_2d_ufs.diffmin.gr3
    diffmax: secofs_2d_ufs.diffmax.gr3
    albedo: secofs_2d_ufs.albedo.gr3
    rough: secofs_2d_ufs.rough.gr3
    station: secofs_2d_ufs.station.in
  domain:
    lon_min: -88.0
    lon_max: -63.0
    lat_min: 17.0
    lat_max: 40.0
  igrd_met: 0
  igrd_obc: 1

# Forcing configuration
# Atmospheric forcing is handled by DATM (not sflux), but we keep the
# config for the prep job's river/OBC/tidal forcing generation.
forcing:
  atmospheric:
    met_num: 2
    primary: GFS
    secondary: HRRR
    forecast_source: GFS
    forecast_source2: HRRR
    scale_hflux: 1.0
    variables:
      - PRMSL
      - TMP
      - SPFH
      - UGRD
      - VGRD
      - PRATE
      - DSWRF
      - DLWRF

  river:
    enabled: true
    primary: nwm
    files:
      ctl_file: secofs_2d_ufs.river.ctl
      clim_file: nosofs.river.clim.usgs.nc
      nwm_reach: secofs_2d_ufs.nwm.reach.dat

  ocean:
    enabled: true
    primary: rtofs
    obc:
      wl_source: RTOFS
      ts_source: null            # No T/S OBC for barotropic mode
    nudging:
      enabled: false             # No T/S nudging in barotropic mode

  tidal:
    enabled: true
    database: tpxo9
    create_forcing: 1
    constituents:
      - M2
      - S2
      - N2
      - K2
      - K1
      - O1
      - P1
      - Q1
    files:
      harmonic_constants_obc: secofs_2d_ufs.bctides.in
      harmonic_constants_ofs: secofs_2d_ufs.bctides.in_template
      harmonic_nwlon: nosofs.HC_NWLON.nc

# Model physics and runtime configuration
model:
  # UFS-Coastal coupled executable (DATM+SCHISM via NUOPC)
  executable: fv3_coastalS.exe
  ocean_model: SCHISM
  barotropic: true               # Flag for scripts to skip T/S forcing staging
  physics:
    dt: 120.0
    extstep_seconds: 120.0
    cpp_lon: -124
    cpp_lat: 45
    # nws=4: NUOPC atmospheric coupling (vs nws=2 for sflux files)
    nws: 4
    nrampwind: 1
    drampwind: 1.0
    iwindoff: 0
    ndtfast: 20
    ihorcon: 0
    ihdif: 0
    idrag: 2
    bfric: 0
    ihhat: 1
    inunfl: 0
    min_depth: 0.01
    rdrg: 3.0e-03
    rdrg2: 0.005
    zob: 0.0005
    visc2: 0.0
    visc4: 0.0
    akt_bak: 5.0e-6
    akv_bak: 5.0e-5
    akk_bak: 5.0e-6
    akp_bak: 5.0e-6
    dcrit: 0.10
    dstart: 151.0
    tide_start: 0.0
    # Barotropic-specific physics overrides
    itur: 0                      # No turbulence closure for 2D (was 3 in 3D)
    nvrt: 2                      # 2 vertical levels (was 63 in 3D)
  run:
    hindcast_days: 0.25
    forecast_days: 2.0
    nowcast_hours: 6
    forecast_hours: 48
    base_date: "2011010100"
    time_start: "2011090100"
  runtime:
    ctl_file: secofs_2d_ufs.param.nml
    met_ctl_file: secofs_2d_ufs.sflux_inputs.txt

# UFS-Coastal coupling configuration
# Reduced task counts for barotropic mode (less computation per timestep)
ufs_coastal:
  enabled: true
  # DATM domain label (used by blending scripts)
  datm_domain: ATLANTIC
  # Coupling interval in seconds (must match runSeq @120 in ufs.configure and dt in param.nml)
  coupling_interval: 120
  # MED+ATM share PETs 0-59 (60 PETs, was 120 in 3D)
  datm_tasks: 60
  # OCN PETs 60-559 (500 PETs, was 1080 in 3D)
  schism_tasks: 500
  # Total MPI tasks (MED+ATM overlap, so total = 60 + 500 = 560)
  total_tasks: 560
  # SCHISM I/O scribes (set to 0 for UFS-Coastal; output handled by CMEPS)
  nscribes: 0
  # Source for DATM atmospheric forcing:
  #   grib2: Extract from raw GRIB2 files (default, wgrib2+Python blend pipeline)
  #   sflux: Run COMF sflux generation first, then convert to DATM format
  #          (strict validation -- identical forcing as standalone SCHISM)
  datm_forcing_source: grib2
  # Blended HRRR+GFS atmospheric forcing
  blend_hrrr_gfs: true
  # Blended grid resolution in degrees (~3km, matches HRRR native resolution)
  blend_resolution: 0.025
  # Transition zone width in degrees at HRRR boundary
  blend_buffer_deg: 0.5
  # Forecast length (hours) for model_configure
  nhours_fcst: 48
  # Atmospheric coupling timestep (seconds) -- matches actual run
  dt_atmos: 720
  # DATM grid dimensions -- fallback values only.
  # The orchestrator reads actual dims from the forcing file after blending,
  # so these are only used if the dimension extraction fails.
  # ATLANTIC domain: (-98,-55,10,53) at 0.025 deg -> 1721x1721
  nx_global: 1721
  ny_global: 1721
  # Template files (in FIXofs)
  templates:
    model_configure: model_configure.template
    datm_in: datm_in.template
    datm_streams: datm.streams.template
    ufs_configure: ufs.configure

# Output configuration
# No 3D field output for barotropic mode
output:
  format: netcdf
  prefix: secofs_2d_ufs
  nstation: 97
  stations:
    enabled: true
    interval: 360
    file: secofs_2d_ufs.station.in
  fields:
    interval: 3600
    def_interval: 86400
  fields_3d:
    enabled: false               # No 3D output for barotropic mode
  quicksave:
    interval: 3600
    def_interval: 86400
  average:
    interval: 3600
  float:
    interval: 3600
  restart:
    interval: 21600

# Computational resources (DATM + SCHISM)
# Reduced from 3D: 560 total tasks (60 DATM + 500 SCHISM) vs 1200 in 3D
resources:
  nprocs: 560
  nscribes: 0
  memory_gb: 500                 # Much less memory than 3D (no tracer arrays)
  walltime_hours: 2

# Workflow stages
stages:
  - prep
  - nowcast
  - forecast
  - post

# Environment variable mappings
shell_mappings:
  framework: comf
  env_prefix: nos
  variables:
    # Model identification
    RUN: system.name
    PREFIXNOS: system.prefix
    OCEAN_MODEL: model.ocean_model

    # Grid files
    GRIDFILE: grid.files.horizontal
    GRIDFILE_LL: grid.files.horizontal_ll
    VGRID_CTL: grid.files.vertical
    VGRID_NU_CTL: grid.files.vertical_nu
    VGRID_FAKE_CTL: grid.files.vertical_fake
    STA_OUT_CTL: grid.files.station
    Nudging_weight: forcing.ocean.nudging.files.nudge_weight

    # Grid dimensions
    np_global: grid.n_nodes
    ne_global: grid.n_elements
    ns_global: grid.n_sides
    nvrt: grid.n_levels
    KBm: grid.n_levels
    NNODE: grid.n_nodes
    NELE: grid.n_elements

    # Domain bounds
    MINLON: grid.domain.lon_min
    MAXLON: grid.domain.lon_max
    MINLAT: grid.domain.lat_min
    MAXLAT: grid.domain.lat_max
    IGRD_MET: grid.igrd_met
    IGRD_OBC: grid.igrd_obc

    # Atmospheric forcing
    MET_NUM: forcing.atmospheric.met_num
    DBASE_MET_NOW: forcing.atmospheric.primary
    DBASE_MET_FOR: forcing.atmospheric.forecast_source
    DBASE_MET_NOW2: forcing.atmospheric.secondary
    DBASE_MET_FOR2: forcing.atmospheric.forecast_source2
    SCALE_HFLUX: forcing.atmospheric.scale_hflux

    # Ocean forcing
    DBASE_WL_NOW: forcing.ocean.obc.wl_source
    DBASE_WL_FOR: forcing.ocean.obc.wl_source
    DBASE_TS_NOW: forcing.ocean.obc.ts_source
    DBASE_TS_FOR: forcing.ocean.obc.ts_source

    # Control files
    RIVER_CTL_FILE: forcing.river.files.ctl_file
    RIVER_CLIM_FILE: forcing.river.files.clim_file
    NWM_REACHID_FILE: forcing.river.files.nwm_reach
    OBC_CTL_FILE: forcing.ocean.obc.files.obc_ctl
    OBC_CLIM_FILE: forcing.ocean.obc.files.obc_clim
    HC_FILE_OBC: forcing.tidal.files.harmonic_constants_obc
    HC_FILE_OFS: forcing.tidal.files.harmonic_constants_ofs
    HC_FILE_NWLON: forcing.tidal.files.harmonic_nwlon

    # Tidal
    CREATE_TIDEFORCING: forcing.tidal.create_forcing

    # Runtime control
    RUNTIME_CTL: model.runtime.ctl_file
    RUNTIME_MET_CTL: model.runtime.met_ctl_file
    DELT_MODEL: model.physics.dt
    EXTSTEP_SECONDS: model.physics.extstep_seconds
    NDTFAST: model.physics.ndtfast
    NWS_VALUE: model.physics.nws
    MIN_DEPTH: model.physics.min_depth
    BASE_DATE: model.run.base_date
    TIME_START: model.run.time_start

    # Physics parameters
    CPP_LON_VALUE: model.physics.cpp_lon
    CPP_LAT_VALUE: model.physics.cpp_lat
    IHORCON_VALUE: model.physics.ihorcon
    IHDIF_VALUE: model.physics.ihdif
    IDRAG_VALUE: model.physics.idrag
    BFRIC_VALUE: model.physics.bfric
    IHHAT_VALUE: model.physics.ihhat
    INUNFL_VALUE: model.physics.inunfl
    NRAMPWIND_VALUE: model.physics.nrampwind
    DRAMPWIND_VALUE: model.physics.drampwind
    IWINDOFF_VALUE: model.physics.iwindoff
    RDRG: model.physics.rdrg
    RDRG2: model.physics.rdrg2
    Zob: model.physics.zob
    VISC2: model.physics.visc2
    VISC4: model.physics.visc4
    AKT_BAK: model.physics.akt_bak
    AKV_BAK: model.physics.akv_bak
    AKK_BAK: model.physics.akk_bak
    AKP_BAK: model.physics.akp_bak
    DCRIT: model.physics.dcrit
    DSTART: model.physics.dstart
    TIDE_START: model.physics.tide_start
    ITUR_VALUE: model.physics.itur
    NVRT_VALUE: model.physics.nvrt
    BAROTROPIC: model.barotropic

    # Run length
    LEN_NOWCAST: _computed.len_nowcast_hours
    LEN_FORECAST: _computed.len_forecast_hours
    RNDAY_NOWCAST: _computed.rnday_nowcast
    RNDAY_FORECAST: _computed.rnday_forecast

    # Output intervals
    NSTA: output.stations.interval
    NSTATION: output.nstation
    NHIS: output.fields.interval
    NDEFHIS: output.fields.def_interval
    NQCK: output.quicksave.interval
    NDEFQCK: output.quicksave.def_interval
    NAVG: output.average.interval
    NFLT: output.float.interval
    NRST: output.restart.interval

    # Resources
    TOTAL_TASKS: resources.nprocs

    # UFS-Coastal specific variables
    USE_DATM: ufs_coastal.enabled
    DATM_FORCING_SOURCE: ufs_coastal.datm_forcing_source
    DATM_BLEND_HRRR_GFS: ufs_coastal.blend_hrrr_gfs
    DATM_DOMAIN: ufs_coastal.datm_domain
    DATM_TASKS: ufs_coastal.datm_tasks
    SCHISM_TASKS: ufs_coastal.schism_tasks
    NSCRIBES: ufs_coastal.nscribes
    BLEND_RESOLUTION: ufs_coastal.blend_resolution
    BLEND_BUFFER_DEG: ufs_coastal.blend_buffer_deg
    DT_ATMOS: ufs_coastal.dt_atmos
    NHOURS_FCST: ufs_coastal.nhours_fcst
    COUPLING_INTERVAL: ufs_coastal.coupling_interval
    NX_GLOBAL: ufs_coastal.nx_global
    NY_GLOBAL: ufs_coastal.ny_global

# GEFS atmospheric ensemble for UFS-Coastal (DATM forcing)
# 15-member atmospheric-only ensemble (no physics perturbation).
# Member 000 is the control run (GFS+HRRR blended DATM forcing + default params)
# Members 001-014 use GEFS perturbation members (GEFS-only DATM, no HRRR blend)
# Barotropic mode is ideal for rapid ensemble generation: same grid, much cheaper
# per member due to no tracer transport.
ensemble:
  enabled: true
  n_members: 15
  method: gefs
  seed: 42                          # Reproducible sampling
  # GEFS (Global Ensemble Forecast System) atmospheric forcing configuration
  # Uses 0.25 deg pgrb2sp25 product (has all 8 sflux variables)
  # Control member uses GFS deterministic (0.25 deg) + HRRR coastal blending
  # Perturbed members use GEFS-only (no HRRR) to preserve ensemble spread at coast
  gefs:
    enabled: true
    n_gefs_members: 14
    resolution: "0p25"
    product: "pgrb2sp25"
    control_member: "gec00"
    perturbation_prefix: "gep"
    members:
      "000":
        label: "control (GFS+HRRR)"
        met_source_1: GFS
        met_source_2: HRRR
      "001":
        label: "GEFS p01"
        met_source_1: GEFS_01
        met_source_2: null
      "002":
        label: "GEFS p02"
        met_source_1: GEFS_02
        met_source_2: null
      "003":
        label: "GEFS p03"
        met_source_1: GEFS_03
        met_source_2: null
      "004":
        label: "GEFS p04"
        met_source_1: GEFS_04
        met_source_2: null
      "005":
        label: "GEFS p05"
        met_source_1: GEFS_05
        met_source_2: null
      "006":
        label: "GEFS p06"
        met_source_1: GEFS_06
        met_source_2: null
      "007":
        label: "GEFS p07"
        met_source_1: GEFS_07
        met_source_2: null
      "008":
        label: "GEFS p08"
        met_source_1: GEFS_08
        met_source_2: null
      "009":
        label: "GEFS p09"
        met_source_1: GEFS_09
        met_source_2: null
      "010":
        label: "GEFS p10"
        met_source_1: GEFS_10
        met_source_2: null
      "011":
        label: "GEFS p11"
        met_source_1: GEFS_11
        met_source_2: null
      "012":
        label: "GEFS p12"
        met_source_1: GEFS_12
        met_source_2: null
      "013":
        label: "GEFS p13"
        met_source_1: GEFS_13
        met_source_2: null
      "014":
        label: "GEFS p14"
        met_source_1: GEFS_14
        met_source_2: null
    extra_sources:
      - GEFS_01
      - GEFS_02
      - GEFS_03
      - GEFS_04
      - GEFS_05
      - GEFS_06
      - GEFS_07
      - GEFS_08
      - GEFS_09
      - GEFS_10
      - GEFS_11
      - GEFS_12
      - GEFS_13
      - GEFS_14
  # No physics perturbation -- atmospheric forcing differences only
  perturb_physics: false
  # Empty parameters block -- no physics perturbation for barotropic ensemble
  parameters: {}
  # Ensemble-specific resources (per member)
  # Reduced from 3D: 560 tasks per member (vs 1200 in 3D)
  resources:
    select: "select=5:ncpus=128:mpiprocs=112"
    walltime: "01:00:00"
  # Ensemble post-processing resources
  post_resources:
    select: "select=1:ncpus=8:mpiprocs=8"
    walltime: "01:00:00"

# Legacy mode
legacy:
  enabled: false
  ush_dir: ""
  fix_dir: ""
  exec_dir: ""
