[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nos_ofs"
version = "1.0.0"
description = "Unified Python package for NOAA Operational Ocean Forecast Systems"
readme = "README.md"
license = {text = "CC0 1.0 Universal"}
requires-python = ">=3.8"
authors = [
    {name = "Mansur Ali Jisan", email = "mansur.jisan@noaa.gov"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Hydrology",
]
keywords = [
    "ocean",
    "forecast",
    "NOAA",
    "SCHISM",
    "FVCOM",
    "ROMS",
    "oceanography",
    "coastal",
    "modeling",
]
dependencies = [
    "numpy>=1.20",
    "pyyaml>=5.4",
]

[project.optional-dependencies]
full = [
    "xarray>=0.19",
    "netCDF4>=1.5",
    "scipy>=1.7",
    "pandas>=1.3",
]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=21.0",
    "flake8>=3.9",
    "mypy>=0.900",
    "isort>=5.0",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
    "myst-parser>=0.18",
]

[project.scripts]
nos-ofs = "nos_ofs.cli:main"
yaml-to-env = "nos_ofs.utils.yaml_to_env:main"

[project.urls]
Homepage = "https://github.com/NOAA-OCS-Modeling/nosofs"
Documentation = "https://noaa-ocs-modeling.github.io/nosofs/"
Repository = "https://github.com/NOAA-OCS-Modeling/nosofs"
Issues = "https://github.com/NOAA-OCS-Modeling/nosofs/issues"

[tool.setuptools]
packages = ["nos_ofs", "nos_ofs.config", "nos_ofs.forcing", "nos_ofs.models", "nos_ofs.utils"]
include-package-data = true

[tool.setuptools.package-data]
nos_ofs = ["*.yaml", "*.json"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["nos_ofs"]
skip_gitignore = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "build/",
    "dist/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external resources",
]

[tool.coverage.run]
source = ["nos_ofs"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
